name: "Publish"

on:
  push:
    tags:
      - "@rust-gear/*@*"
    branches: ["main"]
  workflow_dispatch:

env:
  PACKAGES: "glob"

jobs:
  # Decides whether this event should run the publish pipeline:
  # - tag push / manual dispatch: always
  # - push to main: only when a release tag exists for the current
  #   package.json version but npm does not have that version yet
  #   (i.e. a previous release run failed and this push fixes it)
  check:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether to publish
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          should=false
          IFS=',' read -ra PACKAGE_LIST <<< "${PACKAGES}"
          for package in "${PACKAGE_LIST[@]}"; do
            [ -f "packages/$package/package.json" ] || continue
            NAME=$(node -p "require('./packages/$package/package.json').name")
            VERSION=$(node -p "require('./packages/$package/package.json').version")
            if git rev-parse -q --verify "refs/tags/$NAME@$VERSION" >/dev/null; then
              if ! npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                echo "Resuming release: $NAME@$VERSION is tagged but not published on npm"
                should=true
              fi
            fi
          done
          echo "should_publish=$should" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    strategy:
      matrix:
        # napi CLI v3 no longer sets cross linkers automatically (v2 did), so
        # Linux targets use the official napi-rs mechanisms:
        # - glibc targets: --use-napi-cross (@napi-rs/cross-toolchain, glibc 2.17)
        # - musl targets:  --cross-compile (cargo-zigbuild, needs zig on PATH)
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            flags: "--use-napi-cross"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            flags: "--cross-compile"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            flags: "--use-napi-cross"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            flags: "--cross-compile"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: "pnpm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install Zig (for cargo-zigbuild)
        if: contains(matrix.target, 'linux-musl')
        run: pip3 install ziglang

      - name: Setup pnpm
        run: |
          pnpm install

      - name: Build napi binaries for all packages
        shell: bash
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            echo "Building package: $package"
            if [ -d "packages/$package" ]; then
              cd "packages/$package"
              pnpm build --target ${{ matrix.target }} ${{ matrix.flags }}
              cd ../..
            else
              echo "Package directory packages/$package not found, skipping"
            fi
          done

      - name: Upload napi binaries
        uses: actions/upload-artifact@v4
        with:
          name: napi-binaries-${{ matrix.target }}
          path: packages/*/*.node
          retention-days: 1

  prepublish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 25
          registry-url: "https://registry.npmjs.org"
          scope: "@rust-gear"
          always-auth: true
          cache: "pnpm"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: napi-binaries-*
          path: artifacts/

      - name: Debug List downloaded artifacts
        run: find artifacts/ -name "*.node"

      - name: Organize binaries by package
        shell: bash
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"

          for artifact_dir in artifacts/napi-binaries-*; do
            if [ -d "$artifact_dir" ]; then
              target=$(basename "$artifact_dir" | sed 's/napi-binaries-//')
              echo "Processing target: $target"
              
              for package in "${PACKAGE_LIST[@]}"; do
                node_files=$(find "$artifact_dir" -name "${package}.*.node")
                for node_file in $node_files; do
                  if [ -f "$node_file" ]; then
                    filename=$(basename "$node_file")
                    arch=$(echo "$filename" | sed -E "s/^${package}\.([^.]+)\.node$/\1/")
                    
                    mkdir -p "packages/${package}/npm/${arch}"
                    cp "$node_file" "packages/${package}/npm/${arch}/${filename}"
                    echo "Moved: $node_file -> packages/${package}/${arch}/${filename}"
                  fi
                done
              done
            fi
          done

      - name: Check final output
        shell: bash
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            echo "=== Package: $package ==="
            ls -R packages/$package/ || echo "No files found for $package"
          done

      - name: Setup pnpm
        run: |
          pnpm install

      - name: Generate platform-specific package.json and README.md
        shell: bash
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            if [ -d "packages/$package" ]; then
              cd "packages/$package"
              pnpm packages
              pnpm readme
              cd ../..
            fi
          done

      - name: Make permission publish.sh
        run: chmod +x ./scripts/publish.sh

      - name: Publish packages
        shell: bash
        run: |
          ./scripts/publish.sh "$PACKAGES"

  publish-main:
    needs: prepublish
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 25
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Publish and update main package
        shell: bash
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            echo "Processing main package: $package"
            if [ -d "packages/$package" ]; then
              cd "packages/$package"
              
              # Get package name and version
              PKG_NAME=$(node -p "require('./package.json').name")
              PKG_VERSION=$(node -p "require('./package.json').version")

              # Check if this version already exists on npm
              if npm view "$PKG_NAME@$PKG_VERSION" version &>/dev/null; then
                echo "⚠️  Package $PKG_NAME@$PKG_VERSION already exists, skipping publish..."
                cd ../..
                continue
              fi

              echo "📦 Building and publishing $PKG_NAME@$PKG_VERSION..."
              pnpm build
              pnpm test

              # Inject optionalDependencies (platform packages at this version)
              # into the manifest LAST: pnpm 11 verifies package.json against
              # the lockfile before running any script, so this must come
              # after pnpm build/test and run via node directly.
              # npm publish does not check the pnpm lockfile.
              node ../../scripts/update-main-package.js
              npm publish
              cd ../..
            else
              echo "Package directory packages/$package not found, skipping"
            fi
          done

    # - name: Check final output
    #   shell: bash
    #   run: |
    #     IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
    #     for package in "${PACKAGE_LIST[@]}"; do
    #       echo "=== Package: $package ==="
    #       ls -R packages/$package/ || echo "No files found for $package"
