name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PACKAGES: "glob"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            (cd packages/$package && cargo fmt --all -- --check)
          done

      - name: Run clippy
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            (cd packages/$package && cargo clippy --all-targets --all-features -- -D warnings)
          done

      # The walk-width policy is macOS-gated, so a clippy run on the Linux
      # host never type-checks it. `cargo clippy` does not link, so the darwin
      # target needs no cross toolchain.
      - name: Add cross-compilation target
        run: rustup target add aarch64-apple-darwin

      - name: Run clippy for macOS
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            (cd packages/$package && cargo clippy --target aarch64-apple-darwin --all-targets --all-features -- -D warnings)
          done

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build .node binary
        shell: bash
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            (cd packages/$package && pnpm build)
          done

      # Also prints the topology each runner detects, so the pool sizing is
      # visible per OS. GitHub-hosted runners are uniform VMs: they confirm
      # the probe is a no-op there, not the hybrid-core behaviour, which needs
      # real hardware to observe.
      - name: Run Rust tests
        shell: bash
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            (cd packages/$package && cargo test -- --nocapture)
          done

      - name: Run Node tests
        shell: bash
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            (cd packages/$package && pnpm test)
          done
