name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PACKAGES: "glob"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            cargo fmt --all -- --check --manifest-path packages/$package/Cargo.toml
          done

      - name: Run clippy
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            cargo clippy --all-targets --all-features -- -D warnings --manifest-path packages/$package/Cargo.toml
          done

      - name: Run tests
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            cargo test --manifest-path packages/$package/Cargo.toml
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Build .node binary
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            pnpm --filter $package build
          done

      - name: Run Node tests
        run: |
          IFS=',' read -ra PACKAGE_LIST <<< "${{ env.PACKAGES }}"
          for package in "${PACKAGE_LIST[@]}"; do
            pnpm --filter $package test
          done
